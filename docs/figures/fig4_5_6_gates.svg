<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="sans-serif" font-size="13">
  <style>
    .b{fill:none;stroke:#000;stroke-width:1.5}
    .lbl{font-size:12px}.num{font-size:12px;font-weight:bold}
    .cov{fill:#000;opacity:0.15}
    .pad{fill:none;stroke:#000;stroke-width:1.5;stroke-dasharray:4 2}
    .arw{stroke:#000;stroke-width:1.2;fill:none;marker-end:url(#a)}
    .cap{font-size:11px}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 z" fill="#000"/></marker></defs>

  <!-- 도 4 : G1 상면 흡착 -->
  <text x="120" y="26" text-anchor="middle" class="num">[도 4] G1 상면 흡착 파지</text>
  <!-- 대상 oj 상면(평면도) -->
  <rect class="b" x="40" y="60" width="160" height="90"/>
  <rect class="cov" x="40" y="60" width="66" height="90"/>
  <text x="73" y="110" text-anchor="middle" class="cap">C에 덮임</text>
  <rect class="pad" x="128" y="90" width="46" height="40"/>
  <text x="151" y="114" text-anchor="middle" class="cap">흡착</text>
  <text x="120" y="172" text-anchor="middle" class="cap">노출 영역 ⊇ 흡착 풋프린트 → 통과</text>
  <text x="120" y="190" text-anchor="middle" class="cap">(청구항 3: 노출 대비 비율 ≥ 문턱값)</text>

  <!-- 도 5 : G2 경로 -->
  <text x="360" y="26" text-anchor="middle" class="num">[도 5] G2 무충돌 회수 경로</text>
  <rect class="b" x="270" y="95" width="40" height="55"/><text x="290" y="128" text-anchor="middle" class="cap">B</text>
  <rect class="b" x="330" y="70" width="60" height="80"/><text x="360" y="60" text-anchor="middle" class="cap">그리퍼+oj</text>
  <rect class="b" x="410" y="95" width="40" height="55"/><text x="430" y="128" text-anchor="middle" class="cap">D</text>
  <path class="arw" d="M360,70 L360,42"/>
  <text x="360" y="172" text-anchor="middle" class="cap">파지물 포함 스윕 볼륨이 B·D와</text>
  <text x="360" y="190" text-anchor="middle" class="cap">무충돌 + IK 해 존재 → 통과 (기존 _seg_seg_dist)</text>

  <!-- 도 6 : G3 제거 후 안정 -->
  <text x="600" y="26" text-anchor="middle" class="num">[도 6] G3 제거 후 잔여 안정</text>
  <rect class="b" x="560" y="70" width="50" height="34"/><text x="585" y="92" text-anchor="middle" class="cap">E</text>
  <rect class="b" x="560" y="140" width="80" height="34"/><text x="600" y="162" text-anchor="middle" class="cap">F(지지)</text>
  <line class="b" x1="585" y1="104" x2="585" y2="140" stroke-dasharray="3 2"/>
  <text x="585" y="120" text-anchor="middle" class="cap">×</text>
  <text x="600" y="196" text-anchor="middle" class="cap">oj 제거 후 E의 무게중심 투영(×)이</text>
  <text x="600" y="214" text-anchor="middle" class="cap">F의 지지 다각형 안 → 통과</text>

  <text x="360" y="270" text-anchor="middle" class="lbl">G1 ∧ G2 ∧ G3 을 가상 회수의 매 제거 단계마다 판정 — 하나라도 실패 시 배치 후보 탈락</text>
</svg>
