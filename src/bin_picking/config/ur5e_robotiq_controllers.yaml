# =====================================================================
#  UR5e + Robotiq 2F-85 — gz_ros2_control 컨트롤러 설정
# =====================================================================
# 이 파일은 결합 xacro(`urdf/ur5e_robotiq85_gazebo.urdf.xacro`)의
# gz_ros2_control 플러그인이 <parameters> 로 읽는다.
#
# 컨트롤러 이름은 프로파일(`robot_profiles/data/ur5e_robotiq85.yaml`)의
# arm.controller / gripper.controller 와 **반드시 일치**해야 한다 —
# 어긋나면 스포너가 실패해 로봇이 아예 안 움직인다. `binpick_model verify` 가
# 실행 중인 controller_manager 와 대조해 잡아 준다.
#
# ⚠ UR 순정 설정(ur_simulation_gz/config/ur_controllers.yaml)을 쓰지 않고 따로
#   두는 이유: 그쪽 기본 컨트롤러는 `ur_controllers/ScaledJointTrajectoryController`
#   인데 speed_scaling 인터페이스를 요구하고, 그리퍼 컨트롤러도 없다. 여기서는
#   빈피킹에 필요한 최소 구성(팔 궤적 + 그리퍼 GripperCommand)만 명시한다.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # GripperCommand 액션을 노출하는 표준 병렬 그리퍼 컨트롤러.
    # (프랑카 쪽은 FollowJointTrajectory 를 쓰지만 Robotiq 는 이쪽이 표준이다 —
    #  파이프라인은 gripper_adapters.py 가 두 방식을 모두 흡수한다.)
    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

ur_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

robotiq_gripper_controller:
  ros__parameters:
    # 종동(mimic) 관절은 넣지 않는다 — 구동 관절 하나만 지령한다.
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true          # 물체를 물어 멈추는 것은 정상이다
    # 물체를 물면 목표 위치에 못 가고 멈춘다. 그걸 실패로 보지 않도록 여유를 준다.
    goal_tolerance: 0.05
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5
