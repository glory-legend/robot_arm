<text x="720" y="316" font-size="12" text-anchor="middle" font-weight="400">정면 (축 방향)</text>
<text x="24" y="360" font-size="13" text-anchor="start" font-weight="400">외형: 팔 Ø50 × 70 + 헤드 34 × 50, 작업면에서 몸체 끝까지 높이 62 · 대시보드 아래·틈새처럼 위가 막힌 곳에 진입</text><text x="24" y="380" font-size="13" text-anchor="start" font-weight="400">공정: 그대로 14단계 · 로봇 경로가 크게 바뀜(공구 방향 90°)</text><text x="24" y="400" font-size="13" text-anchor="start" font-weight="400">위험: 베벨 기어·구동축 전달 추가로 부품 수·무게 증가, 가장 큰 재설계</text>
<text x="936" y="422" font-size="11" text-anchor="end" font-weight="400">점선 = 현재 R09 외형 · 치수 mm · 개략 시안</text>
