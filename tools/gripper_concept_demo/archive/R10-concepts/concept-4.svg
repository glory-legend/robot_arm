<text x="24" y="34" font-size="20" text-anchor="start" font-weight="700">시안 4 · 앵글 헤드형 (협소 공간)</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="400">체결축을 플랜지에 대해 90° 꺾음: Ø50 팔 + 높이 50 헤드, 노즈가 옆으로 나감</text>
