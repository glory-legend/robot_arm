<polygon class="base" points="40.0,256.7 250.6,256.7 250.6,103.3 40.0,103.3"/><polygon class="base" points="250.6,217.7 281.8,217.7 281.8,142.3 250.6,142.3"/><polygon class="new" points="40.0,245.0 222.0,245.0 222.0,115.0 40.0,115.0"/><polygon class="new" points="222.0,245.0 310.4,245.0 310.4,115.0 222.0,115.0"/><polygon class="nose" points="228.5,276.2 303.9,276.2 303.9,245.0 228.5,245.0"/><text x="320.4" y="265.8" font-size="12" text-anchor="start" font-weight="400">↓ 체결 방향</text>
