<polygon class="base" points="40.0,256.7 250.6,256.7 250.6,103.3 40.0,103.3"/><polygon class="base" points="250.6,217.7 281.8,217.7 281.8,142.3 250.6,142.3"/><polygon class="new" points="40.0,255.4 214.2,255.4 214.2,104.6 40.0,104.6"/><polygon class="nose" points="214.2,217.7 245.4,217.7 245.4,142.3 214.2,142.3"/>
<text x="40" y="316" font-size="12" text-anchor="start" font-weight="400">옆면 (왼쪽 = 로봇 플랜지, 오른쪽 = 체결 방향)</text>
<line class="axis" x1="620" y1="180" x2="820" y2="180"/><line class="axis" x1="720" y1="80" x2="720" y2="280"/>
<rect class="base" x="640.7" y="103.3" width="158.6" height="153.4" rx="23.400000000000002"/><circle class="new" cx="720" cy="180.0" r="75.4"/><circle class="nose" cx="720" cy="180.0" r="37.7"/>
<text x="720" y="316" font-size="12" text-anchor="middle" font-weight="400">정면 (축 방향)</text>
<text x="24" y="360" font-size="13" text-anchor="start" font-weight="400">외형: Ø58 원통 × 67 + 노즈, 공구 길이 93 → 79 (−15%), 단면 −27%</text><text x="24" y="380" font-size="13" text-anchor="start" font-weight="400">효과: 모서리가 없어 축을 돌려 장애물을 피할 수 있고, 후방 베이(15 mm)가 사라짐</text><text x="24" y="400" font-size="13" text-anchor="start" font-weight="400">공정: 그대로 14단계 · 위험: 링 너트·회전 방지 키를 하우징에 넣는 설계가 필요</text>
<text x="936" y="422" font-size="11" text-anchor="end" font-weight="400">점선 = 현재 R09 외형 · 치수 mm · 개략 시안</text>
</svg>