<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Noto Sans CJK KR, sans-serif">
<style>.base{fill:none;stroke:#8d9aa2;stroke-width:1.5;stroke-dasharray:6 4} .new{fill:#28747a33;stroke:#185c56;stroke-width:2.2} .nose{fill:#bb591f40;stroke:#bb591f;stroke-width:2} .axis{stroke:#20313d;stroke-width:1;stroke-dasharray:2 3} text{fill:#20313d}</style>
<rect width="960" height="430" fill="#f8fafb"/>
<text x="24" y="34" font-size="20" text-anchor="start" font-weight="700">시안 3 · 굴곡면 대응 롱노즈형</text><text x="24" y="58" font-size="13" text-anchor="start" font-weight="400">노즈를 22 mm로 늘리고 끝을 Ø22 접촉 링으로 깎음 · 몸체 앞 모서리 10 mm 모따기</text>
<line class="axis" x1="30" y1="180" x2="560" y2="180"/>
<polygon class="base" points="40.0,256.7 250.6,256.7 250.6,103.3 40.0,103.3"/><polygon class="base" points="250.6,217.7 281.8,217.7 281.8,142.3 250.6,142.3"/><polygon class="new" points="40.0,256.7 224.6,256.7 250.6,230.7 250.6,129.3 224.6,103.3 40.0,103.3"/><polygon class="nose" points="250.6,217.7 297.4,217.7 307.8,208.6 307.8,151.4 297.4,142.3 250.6,142.3"/>
<text x="40" y="316" font-size="12" text-anchor="start" font-weight="400">옆면 (왼쪽 = 로봇 플랜지, 오른쪽 = 체결 방향)</text>
<line class="axis" x1="620" y1="180" x2="820" y2="180"/><line class="axis" x1="720" y1="80" x2="720" y2="280"/>
<rect class="base" x="640.7" y="103.3" width="158.6" height="153.4" rx="23.400000000000002"/><polygon class="new" points="666.7,256.7 773.3,256.7 799.3,230.7 799.3,129.3 773.3,103.3 666.7,103.3 640.7,129.3 640.7,230.7"/><circle class="nose" cx="720" cy="180.0" r="37.7"/><circle class="new" cx="720" cy="180.0" r="28.6"/>
<text x="720" y="316" font-size="12" text-anchor="middle" font-weight="400">정면 (축 방향)</text>
<text x="24" y="360" font-size="13" text-anchor="start" font-weight="400">외형: 몸체 그대로, 공구 길이 93 → 103 · 볼록면 R≥40 mm, 오목 모서리·필렛 안쪽, 깊이 20 mm 카운터보어까지 접근</text><text x="24" y="380" font-size="13" text-anchor="start" font-weight="400">공정: 그대로 14단계 · 핀셋 날 형상은 유지, 몸체 쪽 축(샹크)만 10 mm 길어짐</text><text x="24" y="400" font-size="13" text-anchor="start" font-weight="400">위험: 길어진 노즈로 처짐·흔들림 증가, 로봇 반경 안에서 공구가 길어짐</text>
<text x="936" y="422" font-size="11" text-anchor="end" font-weight="400">점선 = 현재 R09 외형 · 치수 mm · 개략 시안</text>
</svg>