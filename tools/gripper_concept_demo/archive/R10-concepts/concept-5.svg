<rect class="base" x="640.7" y="103.3" width="158.6" height="153.4" rx="23.400000000000002"/><rect class="new" x="640.7" y="107.2" width="158.6" height="114.4" rx="6"/><circle class="nose" cx="720" cy="180.0" r="37.7"/>
<text x="720" y="316" font-size="12" text-anchor="middle" font-weight="400">정면 (축 방향)</text>
<text x="24" y="360" font-size="13" text-anchor="start" font-weight="400">외형: 61 × 44 × 67 + 노즈, 공구 길이 79 · 평행한 벽 사이 46 mm 틈, 벽에서 17 mm 떨어진 구멍까지 접근</text><text x="24" y="380" font-size="13" text-anchor="start" font-weight="400">공정: 그대로 14단계 · 엄지가 있는 쪽(+y)만 두껍고 반대쪽은 노즈 반경까지 얇음</text><text x="24" y="400" font-size="13" text-anchor="start" font-weight="400">위험: 무게중심이 축에서 벗어나 회전 체결 시 흔들림, 비대칭이라 접근 방향을 골라야 함</text>
<text x="936" y="422" font-size="11" text-anchor="end" font-weight="400">점선 = 현재 R09 외형 · 치수 mm · 개략 시안</text>
</svg>