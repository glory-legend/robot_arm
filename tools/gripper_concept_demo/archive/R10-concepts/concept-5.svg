<line class="axis" x1="30" y1="180" x2="560" y2="180"/>
<polygon class="base" points="40.0,256.7 250.6,256.7 250.6,103.3 40.0,103.3"/><polygon class="base" points="250.6,217.7 281.8,217.7 281.8,142.3 250.6,142.3"/><polygon class="new" points="40.0,221.6 214.2,221.6 214.2,107.2 40.0,107.2"/><polygon class="nose" points="214.2,217.7 245.4,217.7 245.4,142.3 214.2,142.3"/>
